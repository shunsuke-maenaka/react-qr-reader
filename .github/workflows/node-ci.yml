name: Node.js CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: yarn install --immutable
      - run: yarn prettier
      - run: yarn eslint
      - run: yarn build
      - run: yarn predeploy
